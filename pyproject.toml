[project]
name = "polymarket-investment-agend-2"
version = "0.1.0"
description = "Event-driven multi-agent Polymarket investment system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
polymarket-agent = "polymarket_agent.main:run"
polymarket-dashboard = "polymarket_agent.dashboard:run"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["polymarket_agent*"]
