server {
    listen 80 default_server;
    server_name _;

    # Comparison Dashboard (Startseite)
    location / {
        root /root/polymarket-dashboard;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Agent 2 Dashboard direkt
    location /agent2/ {
        proxy_pass http://127.0.0.1:8766/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Agent 2 API
    location /api/agent2/ {
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    # Agent 1 API (Read-Only)
    location /api/agent1/ {
        proxy_pass http://127.0.0.1:8767/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin *;
    }

    # Healthcheck
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
